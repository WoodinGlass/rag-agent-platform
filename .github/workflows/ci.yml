name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http,vector,otel,langgraph]"

      - name: Lint (ruff)
        run: ruff check app/ tests/ evals/ scripts/ benchmarks/

      - name: Type check (mypy)
        run: mypy app/

      - name: Test with coverage
        run: |
          pytest -m "" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config

      - name: Build image (load into local daemon, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: rag-agent-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name rag-smoke -p 8000:8000 rag-agent-platform:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "healthz OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status"'
          echo "--- container logs ---"
          docker logs rag-smoke | tail -30
          docker rm -f rag-smoke
