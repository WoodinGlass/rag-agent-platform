name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/ tests/ || true

      - name: Test
        run: |
          # exit code 5 = no tests collected -> bukan error untuk sekarang
          pytest -m "not integration" || code=$?
          if [ "${code:-0}" = "5" ]; then
            echo "no tests collected yet -- skipping"
            exit 0
          fi
          exit ${code:-0}
