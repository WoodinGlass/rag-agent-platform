name: Eval

on:
  # manual trigger from the Actions tab
  workflow_dispatch:
  # weekly drift check (Mondays 06:00 UTC)
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  retrieval:
    name: Retrieval eval (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http,vector]"

      - name: Run retrieval eval
        run: |
          python -m evals.ragas_eval \
            --mode retrieval --k 5 \
            --out-dir evals/reports

      - name: Show report
        run: cat evals/reports/latest.md

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-retrieval
          path: |
            evals/reports/latest.json
            evals/reports/latest.md
            evals/reports/badge.json

      - name: Commit updated reports (if changed)
        run: |
          set -e
          if [[ -z "$(git status --porcelain evals/reports/)" ]]; then
            echo "no change in evals/reports/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/
          git commit -m "chore(eval): refresh retrieval report [skip ci]"
          git push

  ragas:
    name: Ragas eval (LLM judge)
    runs-on: ubuntu-latest
    needs: retrieval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for API key
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY not set; skipping Ragas eval"
          fi

      - name: Install (with eval extras)
        if: steps.check.outputs.has_key == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http,vector,eval]"

      - name: Run Ragas eval
        if: steps.check.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m evals.ragas_eval \
            --mode ragas --k 5 \
            --judge-model gpt-4o-mini \
            --out-dir evals/reports

      - name: Show report
        if: steps.check.outputs.has_key == 'true'
        run: cat evals/reports/latest.md

      - name: Upload Ragas artifact
        if: steps.check.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-ragas
          path: |
            evals/reports/latest.json
            evals/reports/latest.md
            evals/reports/badge.json

      - name: Skipped note
        if: steps.check.outputs.has_key != 'true'
        run: |
          echo "Ragas eval skipped: add repository secret OPENAI_API_KEY"
          echo "to enable it. See README § Evaluation for context."
