[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-platform"
version = "0.1.0"
description = "RAG + AI agent backend with tool-calling and structured outputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm         = ["openai>=1.30", "anthropic>=0.30", "langchain>=0.2", "langgraph>=0.1"]
vector      = ["chromadb>=0.5"]
qdrant      = ["qdrant-client>=1.10"]
agents      = ["langchain-openai>=0.1", "langchain-anthropic>=0.1"]
langgraph   = ["langgraph>=0.2"]
kafka       = ["kafka-python>=2.0"]
s3          = ["boto3>=1.30"]
http        = ["httpx>=0.27"]
rerank      = ["sentence-transformers>=3.0"]
otel        = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
eval        = ["ragas>=0.1", "datasets>=2.19"]
dev         = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit",
]
integration = ["testcontainers>=4.5", "psycopg[binary]>=3.1"]
all         = ["rag-agent-platform[llm,vector,agents,kafka,langgraph,http,rerank,otel,eval,dev,integration]"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker / external services",
    "slow: long-running",
    "provider: requires a real LLM provider API key",
]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # main entrypoint + lifespan exercised via integration; skip from core %
    "app/main.py",
    # optional-dep code paths (chroma, openai) run only when extras installed
    "app/rag/store.py",
    "app/rag/embedder.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"tests/unit/test_api_deps.py" = ["B008"]
"tests/integration/test_api*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["chromadb.*", "openai.*"]
ignore_missing_imports = true
