# Minimal OpenTelemetry Collector config.
#
# Receives OTLP over HTTP (port 4318) and logs every span. Good enough
# for local dev and portfolio demos. Replace `logging` with a real
# backend (Jaeger, Tempo, Honeycomb, Datadog) in production.
#
# Usage (with the API container):
#   docker compose -f docker/docker-compose.yml --profile otel up --build
#   OTEL_ENABLED=true OTEL_EXPORTER=otlp \
#   OTEL_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces \
#   docker compose -f docker/docker-compose.yml up api
#
# Reference: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  # logs every span to stdout; keep for local dev
  logging:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
